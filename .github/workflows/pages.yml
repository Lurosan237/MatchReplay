name: Website

# Builds the site from StatsBomb's open data and publishes it on GitHub Pages.
# Nothing generated is committed: the match files are made here, every time.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/matchreplay/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: statsbomb-events-${{ hashFiles('src/matchreplay/ingest.py') }}
          restore-keys: statsbomb-events-
      - run: python -m matchreplay.ingest --no-360
      - run: python -m matchreplay.web_export
      - name: World Cup 2022 tracking for the 3D view (built by the Tracking workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download tracking-data -p tracking.tar; then tar -xf tracking.tar -C site && rm tracking.tar
          else echo "No tracking published yet: the site goes out without the 3D view"; fi
      - run: rm -rf site/test site/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
