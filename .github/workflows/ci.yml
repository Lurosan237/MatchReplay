name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      # Tests that need the downloaded matches skip themselves; the pipeline fixtures are committed
      - run: pytest -q

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Builds the Flink job and runs the parity test: Flink must reproduce the Python reference
      - run: mvn -B -ntp -f pipeline/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: pipeline/target/surefire-reports
          if-no-files-found: ignore
