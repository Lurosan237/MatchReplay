name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      # Tests that need the downloaded matches skip themselves; the pipeline fixtures are committed
      - run: pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt && pip install -e .
      # The replay model, on every AFCON 2023 match: final scores, goals, timeline, clock
      - run: python -m matchreplay.ingest --only afcon2023 --no-360
      - run: python -m matchreplay.web_export --only afcon2023
      - run: npm test --prefix site

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Builds the Flink job and runs the parity test: Flink must reproduce the Python reference
      - run: mvn -B -ntp -f pipeline/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: pipeline/target/surefire-reports
          if-no-files-found: ignore

  e2e:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: mvn -B -ntp -q -f pipeline/pom.xml package -DskipTests
      - run: pip install -r requirements.txt -r requirements-stream.txt && pip install -e .
      # The two test matches only (about 15 MB from StatsBomb's open data)
      - run: python -m matchreplay.ingest --only afcon2023
      - run: scripts/e2e.sh
      - if: always()
        run: docker compose logs --tail 200 jobmanager taskmanager
